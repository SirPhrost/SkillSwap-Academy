spring.application.name=skillswap
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/skillswap;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.thymeleaf.cache=false

skillswap.verification-service.base-url=${VERIFICATION_SERVICE_URL:http://localhost:8081/api/verifications}
skillswap.verification-service.username=${VERIFICATION_SERVICE_USERNAME:primary-app}
skillswap.verification-service.password=${VERIFICATION_SERVICE_PASSWORD:skillswap-api-secret}
