<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${workshop.title + ' · SkillSwap Academy'}">Workshop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><a class="text-decoration-none" th:href="@{/workshops}">← Back to workshops</a><div class="row g-4 mt-1"><div class="col-lg-8"><div class="card shadow-sm p-4 p-md-5"><div class="d-flex flex-wrap gap-2"><span class="soft-badge" th:text="${workshop.category.displayName}"></span><span class="badge text-bg-light" th:text="${workshop.level.displayName}"></span></div><h1 class="display-6 fw-bold mt-3" th:text="${workshop.title}"></h1><p class="lead text-secondary" th:text="${workshop.description}"></p></div></div><div class="col-lg-4"><div class="card shadow-sm p-4"><h2 class="h5">Workshop details</h2><dl class="row mb-0"><dt class="col-5">Instructor</dt><dd class="col-7" th:text="${workshop.instructorName}"></dd><dt class="col-5">Duration</dt><dd class="col-7"><span th:text="${workshop.durationHours}"></span> hours</dd><dt class="col-5">Capacity</dt><dd class="col-7"><span th:text="${workshop.capacity}"></span> learners</dd><dt class="col-5">Added</dt><dd class="col-7" th:text="${workshop.createdDateDisplay}"></dd></dl></div></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
