<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Workshop · SkillSwap Academy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm p-4 p-md-5"><h1 class="h2 fw-bold">Create a workshop</h1><p class="text-secondary">Your signed-in name and email will be saved as the instructor.</p><form th:action="@{/workshops/create}" th:object="${workshop}" method="post" novalidate><div class="mb-3"><label class="form-label" for="title">Title</label><input class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" id="title" th:field="*{title}"><div class="invalid-feedback" th:errors="*{title}"></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'" id="category" th:field="*{category}"><option value="">Choose...</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item.displayName}"></option></select><div class="invalid-feedback" th:errors="*{category}"></div></div><div class="col-md-6"><label class="form-label" for="level">Skill level</label><select class="form-select" th:classappend="${#fields.hasErrors('level')} ? 'is-invalid'" id="level" th:field="*{level}"><option value="">Choose...</option><option th:each="item : ${levels}" th:value="${item}" th:text="${item.displayName}"></option></select><div class="invalid-feedback" th:errors="*{level}"></div></div><div class="col-md-6"><label class="form-label" for="durationHours">Duration (hours)</label><input class="form-control" th:classappend="${#fields.hasErrors('durationHours')} ? 'is-invalid'" id="durationHours" type="number" min="1" max="40" th:field="*{durationHours}"><div class="invalid-feedback" th:errors="*{durationHours}"></div></div><div class="col-md-6"><label class="form-label" for="capacity">Capacity</label><input class="form-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'" id="capacity" type="number" min="1" max="100" th:field="*{capacity}"><div class="invalid-feedback" th:errors="*{capacity}"></div></div></div><div class="my-3"><label class="form-label" for="description">Description</label><textarea class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" id="description" rows="6" th:field="*{description}"></textarea><div class="invalid-feedback" th:errors="*{description}"></div></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Save workshop</button><a class="btn btn-outline-secondary" th:href="@{/workshops}">Cancel</a></div></form></div></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
