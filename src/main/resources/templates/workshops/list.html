<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workshops · SkillSwap Academy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"><div><span class="soft-badge">Workshop catalogue</span><h1 class="display-6 fw-bold mt-2 mb-1">Find your next skill</h1><p class="text-secondary mb-0">Search, filter, and sort live database records.</p></div><a sec:authorize="hasAnyRole('INSTRUCTOR','ADMIN')" class="btn btn-primary" th:href="@{/workshops/new}">Create workshop</a></div>
<form method="get" th:action="@{/workshops}" class="card shadow-sm p-3 mb-4"><div class="row g-3"><div class="col-lg-4"><label class="form-label" for="keyword">Search</label><input class="form-control" id="keyword" name="keyword" th:value="${keyword}" placeholder="Title, instructor, or description"></div><div class="col-md-6 col-lg-2"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category"><option value="">All categories</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item.displayName}" th:selected="${selectedCategory == item}"></option></select></div><div class="col-md-6 col-lg-2"><label class="form-label" for="level">Level</label><select class="form-select" id="level" name="level"><option value="">All levels</option><option th:each="item : ${levels}" th:value="${item}" th:text="${item.displayName}" th:selected="${selectedLevel == item}"></option></select></div><div class="col-md-6 col-lg-2"><label class="form-label" for="sortBy">Sort by</label><select class="form-select" id="sortBy" name="sortBy"><option value="createdAt" th:selected="${sortBy == 'createdAt'}">Newest</option><option value="title" th:selected="${sortBy == 'title'}">Title</option><option value="durationHours" th:selected="${sortBy == 'durationHours'}">Duration</option><option value="capacity" th:selected="${sortBy == 'capacity'}">Capacity</option></select></div><div class="col-md-6 col-lg-2"><label class="form-label" for="direction">Direction</label><select class="form-select" id="direction" name="direction"><option value="asc" th:selected="${direction == 'asc'}">Ascending</option><option value="desc" th:selected="${direction == 'desc'}">Descending</option></select></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Apply filters</button><a class="btn btn-outline-secondary" th:href="@{/workshops}">Reset</a></div></div></form>
<div th:if="${workshopPage.empty}" class="alert alert-info">No workshops matched those filters.</div><div class="row g-4"><div class="col-md-6 col-lg-4" th:each="workshop : ${workshopPage.content}"><article class="card workshop-card shadow-sm h-100 p-4"><div class="d-flex justify-content-between gap-2"><span class="soft-badge" th:text="${workshop.category.displayName}">Technology</span><span class="badge text-bg-light" th:text="${workshop.level.displayName}">Beginner</span></div><h2 class="h5 mt-3" th:text="${workshop.title}">Workshop title</h2><p class="text-secondary small mb-2">with <span th:text="${workshop.instructorName}">Instructor</span></p><p class="text-secondary" th:text="${#strings.abbreviate(workshop.description, 120)}">Description</p><div class="mt-auto d-flex justify-content-between align-items-center"><span class="small text-secondary"><span th:text="${workshop.durationHours}">4</span> hrs · <span th:text="${workshop.capacity}">15</span> seats</span><a class="btn btn-sm btn-outline-primary" th:href="@{/workshops/{id}(id=${workshop.id})}">View</a></div></article></div></div>
<nav th:if="${workshopPage.totalPages > 1}" class="mt-5" aria-label="Workshop pages"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${workshopPage.first} ? 'disabled'"><a class="page-link" th:href="@{/workshops(page=${workshopPage.number - 1},keyword=${keyword},category=${selectedCategory},level=${selectedLevel},sortBy=${sortBy},direction=${direction})}">Previous</a></li><li class="page-item" th:each="number : ${#numbers.sequence(0, workshopPage.totalPages - 1)}" th:classappend="${number == workshopPage.number} ? 'active'"><a class="page-link" th:text="${number + 1}" th:href="@{/workshops(page=${number},keyword=${keyword},category=${selectedCategory},level=${selectedLevel},sortBy=${sortBy},direction=${direction})}"></a></li><li class="page-item" th:classappend="${workshopPage.last} ? 'disabled'"><a class="page-link" th:href="@{/workshops(page=${workshopPage.number + 1},keyword=${keyword},category=${selectedCategory},level=${selectedLevel},sortBy=${sortBy},direction=${direction})}">Next</a></li></ul></nav></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
