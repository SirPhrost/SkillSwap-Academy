<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log In · SkillSwap Academy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm p-4 p-md-5"><h1 class="h2 fw-bold">Welcome back</h1><p class="text-secondary">Log in with your SkillSwap Academy account.</p><div th:if="${param.error}" class="alert alert-danger">The email or password was incorrect.</div><div th:if="${param.registered}" class="alert alert-success">Account created. You can log in now.</div><form th:action="@{/login}" method="post" class="mt-3"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100" type="submit">Log in</button></form><p class="text-center text-secondary mt-4 mb-0">No account? <a th:href="@{/register}">Register here</a>.</p></div></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
