<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register · SkillSwap Academy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card shadow-sm p-4 p-md-5"><h1 class="h2 fw-bold">Create your learner account</h1><p class="text-secondary">New public registrations receive the Student role.</p><form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate><div class="mb-3"><label class="form-label" for="fullName">Full name</label><input class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" id="fullName" th:field="*{fullName}"><div class="invalid-feedback" th:errors="*{fullName}"></div></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email" type="email" th:field="*{email}"><div class="invalid-feedback" th:errors="*{email}"></div></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" type="password" th:field="*{password}"><div class="form-text">At least 8 characters with a letter and number.</div><div class="invalid-feedback" th:errors="*{password}"></div></div><div class="mb-4"><label class="form-label" for="confirmPassword">Confirm password</label><input class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" id="confirmPassword" type="password" th:field="*{confirmPassword}"><div class="invalid-feedback" th:errors="*{confirmPassword}"></div></div><button class="btn btn-primary w-100" type="submit">Create account</button></form></div></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
