<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard · SkillSwap Academy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><span class="soft-badge">Member dashboard</span><h1 class="display-6 fw-bold mt-3">Hello, <span th:text="${user.fullName}">Member</span></h1><p class="text-secondary">Signed in as <strong th:text="${user.role}">STUDENT</strong>.</p><div class="row g-4 mt-2"><div class="col-md-4"><div class="stat-card shadow-sm"><p class="text-secondary mb-1">Available workshops</p><p class="display-6 fw-bold mb-0" th:text="${workshopCount}">6</p></div></div><div class="col-md-4" sec:authorize="hasAnyRole('INSTRUCTOR','ADMIN')"><div class="stat-card shadow-sm"><p class="text-secondary mb-1">Workshops you teach</p><p class="display-6 fw-bold mb-0" th:text="${myWorkshopCount}">0</p></div></div></div><div class="card shadow-sm p-4 mt-4"><h2 class="h4">Quick actions</h2><div class="d-flex flex-wrap gap-2"><a class="btn btn-primary" th:href="@{/workshops}">Browse workshops</a><a sec:authorize="hasAnyRole('INSTRUCTOR','ADMIN')" class="btn btn-outline-primary" th:href="@{/workshops/new}">Create workshop</a><a sec:authorize="hasRole('ADMIN')" class="btn btn-dark" th:href="@{/admin}">Open admin area</a></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
