<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container py-2">
        <a class="navbar-brand text-primary" th:href="@{/}">SkillSwap Academy</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/workshops}">Workshops</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/how-it-works}">How it works</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin}">Admin</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a sec:authorize="isAnonymous()" class="btn btn-outline-secondary" th:href="@{/login}">Log in</a>
                <a sec:authorize="isAnonymous()" class="btn btn-primary" th:href="@{/register}">Join free</a>
                <a sec:authorize="isAuthenticated()" class="btn btn-outline-primary" th:href="@{/dashboard}">Dashboard</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-dark" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-5 mt-5 border-top bg-white">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>© 2026 SkillSwap Academy</span>
        <span>Learn something. Teach something. Grow together.</span>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
