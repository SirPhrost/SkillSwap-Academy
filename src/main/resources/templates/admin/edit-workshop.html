<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Workshop · SkillSwap Academy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm p-4 p-md-5"><h1 class="h2 fw-bold">Edit workshop</h1><p class="text-secondary">Admin-only content management.</p><form th:action="@{/admin/workshops/{id}/edit(id=${workshop.id})}" th:object="${workshop}" method="post" novalidate><div class="mb-3"><label class="form-label" for="title">Title</label><input class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" id="title" th:field="*{title}"><div class="invalid-feedback" th:errors="*{title}"></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category" th:field="*{category}"><option th:each="item : ${categories}" th:value="${item}" th:text="${item.displayName}"></option></select></div><div class="col-md-6"><label class="form-label" for="level">Level</label><select class="form-select" id="level" th:field="*{level}"><option th:each="item : ${levels}" th:value="${item}" th:text="${item.displayName}"></option></select></div><div class="col-md-6"><label class="form-label" for="durationHours">Duration</label><input class="form-control" id="durationHours" type="number" th:field="*{durationHours}"><div class="text-danger small" th:errors="*{durationHours}"></div></div><div class="col-md-6"><label class="form-label" for="capacity">Capacity</label><input class="form-control" id="capacity" type="number" th:field="*{capacity}"><div class="text-danger small" th:errors="*{capacity}"></div></div></div><div class="my-3"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" rows="6" th:field="*{description}"></textarea><div class="text-danger small" th:errors="*{description}"></div></div><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-outline-secondary" th:href="@{/admin}">Cancel</a></form></div></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: scripts}"></div></body></html>
