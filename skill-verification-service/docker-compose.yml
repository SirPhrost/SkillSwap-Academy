services:
  postgres:
    image: postgres:17-alpine
    container_name: skillswap-verification-postgres
    environment:
      POSTGRES_DB: verificationdb
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
    ports:
      - "5433:5432"
    volumes:
      - verification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d verificationdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verification_postgres_data:
